<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me - Joshua Adediran</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="/profile.png" />
  </head>
  <body>
      <header class="page-header">
          <nav>
              <a href="index.html">Home</a>
              <a href="about.html">About Me</a>
              <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </header>
        <main>
        <section class="profile-card">
        <div id="success-message" class="success-message" data-testid="test-contact-success"></div>
        <h2>Contact Me</h2>
        <p>Have a question or want to work together? Drop me a line!</p>
        <form id="contact-form" class="contact-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              data-testid="test-contact-name"
              required
              aria-describedby="error-name"
            />
            <div id="error-name" class="error-message" data-testid="test-contact-error-name"></div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              data-testid="test-contact-email"
              required
              aria-describedby="error-email"
            />
            <div id="error-email" class="error-message" data-testid="test-contact-error-email"></div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              data-testid="test-contact-subject"
              required
              aria-describedby="error-subject"
            />
            <div id="error-subject" class="error-message" data-testid="test-contact-error-subject"></div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" data-testid="test-contact-message" required aria-describedby="error-message"></textarea>
            <div id="error-message" class="error-message" data-testid="test-contact-error-message"></div>
          </div>
          <button type="submit" data-testid="test-contact-submit">Send Message</button>
        </form>
      </section>
    </main>
    <script src="contact.js"></script>
  </body>
</html>
